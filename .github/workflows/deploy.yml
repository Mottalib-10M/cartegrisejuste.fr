name: Build et déploiement sur GitHub Pages

# push sur main : tests du moteur, build (avec contrôle des extraits), publication GitHub Pages,
# puis ping IndexNow de toutes les URL du sitemap (RECETTE §15, point 7).
on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: npm ci
      - name: Tests du moteur
        run: npx vitest run
      - name: Build (avec contrôle des extraits)
        run: npm run build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Checkout (script IndexNow)
        uses: actions/checkout@v4
      - name: Ping IndexNow
        continue-on-error: true
        run: bash scripts/indexnow.sh https://cartegrisejuste.fr
